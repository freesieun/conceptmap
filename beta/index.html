<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thought Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* layout idea: folder tree on the left, one full sheet of graph paper on the right; ink-outlined boxes with colored titles; a detail sheet slides over the paper */
:root{
  --paper:#f3f4f7; --grid:#dcdfe6; --ink:#1c1d22; --card:#ffffff; --side-bg:#e9ebf0;
  --violet:#7447d1; --violet-soft:#ece5fb; --muted:#6f7380; --danger:#c0392b;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --side:0px;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --paper:#16171b; --grid:#25272e; --ink:#e8e8ee; --card:#1f2127; --side-bg:#1b1c21;
  --violet:#b9a0ff; --violet-soft:#2c2640; --muted:#8b8f9b; --danger:#ff8a7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden}
body.side-open{--side:264px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

/* sidebar */
#side{position:absolute;left:0;top:0;bottom:0;width:264px;background:var(--side-bg);border-right:1.5px solid var(--ink);display:none;flex-direction:column;z-index:25}
body.side-open #side{display:flex}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 16px}
.side-head b{font-size:16px;font-weight:600}
.icon{background:transparent;border:0;border-radius:5px;padding:3px 8px;font-size:15px;line-height:1.3;color:var(--muted)}
.icon:hover{background:var(--violet-soft);color:var(--ink)}
#tree{flex:1;overflow:auto;padding:4px 8px 12px}
.row{display:flex;align-items:center;gap:4px;border-radius:6px;padding:4px 4px 4px 8px;min-height:32px}
.row .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;border:0;text-align:left;padding:2px 0}
.row.folder .label{font-weight:600}
.row.folder .label::before{content:"▾";display:inline-block;width:16px;color:var(--muted)}
.row.folder.shut .label::before{content:"▸"}
.row.map{padding-left:28px}
.row.map.loose{padding-left:8px}
.row.map:hover,.row.folder:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.row.map.on{background:var(--violet-soft)}
.row.map.on .label{color:var(--violet);font-weight:600}
.row .icon{visibility:hidden}
.row:hover .icon,.row:focus-within .icon{visibility:visible}
.row input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--violet);border-radius:4px;padding:2px 6px}
.side-note{color:var(--muted);font-size:13px;padding:10px 8px 4px}
.side-foot{display:flex;gap:6px;padding:10px 12px 14px;border-top:1px solid var(--grid)}
.side-foot{flex-wrap:wrap}
.side-foot button{flex:1}
.side-foot button{flex:1 1 40%}
.side-foot #s-out,.side-foot #s-who{flex-basis:100%}
.side-search{padding:0 12px 8px}
.side-search input{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px}
.hit{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:6px 8px}
.hit:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.hit b{display:block;font-weight:600;color:var(--violet);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit span{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot #s-who{padding:0;overflow:hidden;text-overflow:ellipsis}
#gate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--paper);z-index:70;padding:16px}
#gate.on{display:flex}
#gate .box{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;max-width:360px}
#gate b{font-size:24px;font-weight:600}
#gate-t{color:var(--muted)}
.group.arrows button{font-size:19px;line-height:1;padding:4px 10px}

/* canvas */
#vp{position:absolute;left:var(--side);top:0;right:0;bottom:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
#vp.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge .line{stroke:var(--ec,var(--ink));stroke-width:1.8;fill:none}
.edge .hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
.edge.sel .line{stroke:var(--ec,var(--violet));stroke-width:3.4}
.edge .head{fill:var(--ec,var(--ink))}
.edge.sel .head{fill:var(--ec,var(--violet))}
.edge .lbl{font-size:17px;font-weight:600;fill:var(--ec,var(--ink));text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round;pointer-events:all;cursor:pointer;user-select:none;-webkit-user-select:none}
.edge.sel .lbl{fill:var(--ec,var(--violet))}
.lbl-in{position:fixed;transform:translate(-50%,-50%);z-index:80;width:200px;font:600 14px var(--font);padding:4px 8px;border:1.5px solid var(--violet);border-radius:6px;background:var(--card);color:var(--ink);outline:none;text-align:center}
#temp{stroke:var(--violet);stroke-width:2;stroke-dasharray:6 5;fill:none}

.card{--cc:var(--violet);position:absolute;background:var(--card);border:1.6px solid var(--ink);border-radius:6px;cursor:pointer}
.card[data-c="red"]{--cc:#d2453c}.card[data-c="orange"]{--cc:#d07a1f}.card[data-c="green"]{--cc:#2a9a66}
.card[data-c="blue"]{--cc:#2f7fd6}.card[data-c="gray"]{--cc:#727785}
.card[data-c]{background:color-mix(in srgb,var(--cc) 13%,var(--card));border-color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
.card.sel{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.card .title{padding:14px 16px;color:var(--cc);font-weight:600;font-size:20px;line-height:1.35;word-break:break-word;white-space:pre-wrap;min-height:54px}
.card[data-c] .title{color:color-mix(in srgb,var(--cc) 78%,var(--ink))}
.card .title:empty::before{content:attr(data-ph);color:var(--muted);font-weight:400}
.card .title[contenteditable="true"]{cursor:text;user-select:text;-webkit-user-select:text;outline:none;background:var(--violet-soft);border-radius:4px}
.card.image .title{padding:8px 12px;font-size:14px;min-height:0;border-top:1px solid var(--grid)}
.card.image .title:empty:not([contenteditable="true"]){display:none}
.card .pic{display:none}
.card.image .pic{display:block;padding:8px}
.card .pic img{display:block;width:100%;height:auto;border-radius:3px;background:#fff;pointer-events:none}
.card .pic .missing{padding:18px 8px;text-align:center;color:var(--muted);font-size:13px}
.card .more{display:none;position:absolute;right:7px;bottom:6px;width:16px;height:3px;border-radius:2px;background:var(--cc);opacity:.55;box-shadow:0 -5px 0 var(--cc)}
.card.has-body .more{display:block}
.card.image.has-body .more{top:12px;right:12px;bottom:auto}
.card .h{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--violet);opacity:0;cursor:crosshair;transition:opacity .12s}
.card:hover .h,.card.sel .h{opacity:1}
.h-n{left:50%;top:-8px;margin-left:-7px}.h-s{left:50%;bottom:-8px;margin-left:-7px}
.h-w{top:50%;left:-8px;margin-top:-7px}.h-e{top:50%;right:-8px;margin-top:-7px}
.card .grip{position:absolute;right:-5px;bottom:-5px;width:14px;height:14px;cursor:nwse-resize;display:none}
.card.sel .grip{display:block}
.card.sel .grip::after{content:"";position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:2px solid var(--violet);border-bottom:2px solid var(--violet)}

#mini{position:absolute;display:none;gap:4px;padding:4px;background:#1c1d22;border-radius:8px;transform-origin:0 100%;white-space:nowrap;z-index:5;align-items:center}
#mini.on{display:flex}
#mini button{background:transparent;border:0;color:#f3f4f7;padding:5px 10px;border-radius:5px;font-size:13px}
#mini button:hover{background:rgba(255,255,255,.16)}
#mini .dots{display:flex;align-items:center;gap:5px;padding:0 6px;border-left:1px solid rgba(255,255,255,.2);border-right:1px solid rgba(255,255,255,.2)}
#mini .dot{width:18px;height:18px;padding:0;border-radius:50%;border:2px solid transparent}
#mini .dot.cur{border-color:#fff}
#mini .dot:hover{transform:scale(1.15)}
#mini .dot.none{background:linear-gradient(135deg,transparent 44%,#ff8a7a 44%,#ff8a7a 56%,transparent 56%);border-color:#c9ccd4}
#mini .dot.none.cur{border-color:#fff}
#mini .dot.edit{position:relative;overflow:hidden;cursor:pointer;border-color:#fff;display:inline-block}
#mini button.x{padding:0 4px;font-size:14px;line-height:1;margin-left:-4px}
#mini button.ed{padding:3px 8px;font-size:12px;color:#c9ccd4}
#mini .dot.add{display:inline-flex;align-items:center;justify-content:center;position:relative;color:#f3f4f7;border:2px dashed #c9ccd4;font-size:13px;line-height:1;cursor:pointer;overflow:hidden}
#mini .dot.add input,#mini .dot.edit input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
#mini button:disabled{opacity:.8;cursor:default}
#marq{position:absolute;display:none;border:1.5px dashed var(--violet);background:color-mix(in srgb,var(--violet) 12%,transparent);pointer-events:none;z-index:6}
#d-imgs{display:flex;flex-direction:column;gap:14px}
#d-imgs:empty{display:none}
#d-imgs figure{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
#d-imgs img{max-width:100%;border:1.5px solid var(--ink);border-radius:6px;background:#fff;display:block}

#bar{position:absolute;left:calc(var(--side) + 16px);top:16px;right:16px;display:flex;flex-wrap:nowrap;gap:8px;align-items:center;pointer-events:none;z-index:10}
#bar>*{pointer-events:auto}
.group{display:flex;align-items:center;gap:2px;background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:3px}
.group button{background:transparent;border:0;padding:6px 11px;border-radius:5px;font-size:14px}
.group button:hover{background:var(--violet-soft)}
#crumb{min-width:36px;flex-shrink:1;padding:6px 10px;font-weight:600;border-right:1px solid var(--grid);margin-right:2px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crumb i{font-style:normal;font-weight:400;color:var(--muted)}
#zoom{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
#r-group{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
#m-group{min-width:0;flex-shrink:1}
#m-group button,#z-group{flex-shrink:0;white-space:nowrap}
body.tight #status{min-width:0;font-size:0;gap:0;padding:9px}
body.zoom-low #z-group{position:fixed;right:16px;bottom:14px}
#status{min-width:88px;background:var(--card);border:1.5px solid var(--grid);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
#status[data-s="saved"]::before{background:#2e9e6b}
#status[data-s="saving"]::before{background:#d9a21b}
#status[data-s="error"]::before,#status[data-s="off"]::before{background:var(--danger)}

#hint{position:absolute;left:calc(var(--side) + 16px);right:16px;bottom:14px;text-align:center;color:var(--muted);font-size:13px;pointer-events:none;z-index:4}
#empty{position:absolute;left:var(--side);top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:3;padding:16px}
#empty.on{display:flex}
#empty div{max-width:340px;text-align:center;color:var(--muted)}
#empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-weight:600}

#toast{position:absolute;left:calc(50% + var(--side) / 2);bottom:48px;transform:translateX(-50%);background:#1c1d22;color:#f3f4f7;padding:9px 14px;border-radius:8px;font-size:14px;display:none;gap:12px;align-items:center;z-index:40;max-width:calc(100% - 32px)}
#toast.on{display:flex}
#toast button{background:transparent;border:0;color:inherit;text-decoration:underline;padding:0;font-size:14px}

#menu{position:fixed;display:none;flex-direction:column;min-width:170px;background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:4px;z-index:50}
#menu.on{display:flex}
#menu button{background:transparent;border:0;text-align:left;padding:6px 10px;border-radius:5px;font-size:14px}
#menu button:hover{background:var(--violet-soft)}
#menu button.danger{color:var(--danger)}
#menu hr{border:0;border-top:1px solid var(--grid);margin:4px 0;width:100%}

#ask{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,14,.45);z-index:60;padding:16px}
#ask.on{display:flex}
#ask .box{background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:20px;max-width:380px;display:flex;flex-direction:column;gap:16px}
#ask .btns{display:flex;justify-content:flex-end;gap:8px}

#detail{position:absolute;left:var(--side);top:0;right:0;bottom:0;background:var(--paper);z-index:20;display:none;overflow:auto;padding:16px}
#detail.on{display:block}
.sheet{max-width:720px;margin:0 auto;padding:8px 0 80px;display:flex;flex-direction:column;gap:18px}
.sheet-top{display:flex;justify-content:space-between;gap:8px}
.plain{background:var(--card);border:1.5px solid var(--ink);border-radius:8px;padding:7px 13px;font-size:14px}
.plain:hover{background:var(--violet-soft)}
.plain.danger{border-color:var(--grid);color:var(--danger)}
.plain.solid{background:var(--danger);border-color:var(--danger);color:#fff}
#d-title{width:100%;border:0;border-bottom:3px solid var(--violet);background:transparent;color:var(--violet);font:600 28px/1.3 var(--font);padding:6px 0 10px}
#d-title::placeholder{color:var(--muted);font-weight:400}
#d-title:focus-visible{outline:none}
#d-pic img{max-width:100%;border:1.5px solid var(--ink);border-radius:6px;background:#fff;display:block}
#d-body{width:100%;min-height:280px;border:0;background:transparent;color:var(--ink);font:400 16px/1.75 var(--font);resize:none;padding:0;overflow:hidden}
#d-body:focus-visible{outline:none}
#d-body{outline:none;overflow:visible;word-break:break-word}
#d-body.blank::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rich ul,.rich ol{margin:.2em 0;padding-left:1.5em}
.rich h3{font-size:1.15em;margin:.5em 0 .2em;font-weight:600}
.rich p{margin:0}
.rich sub,.rich sup{font-size:.72em;line-height:0}
.fmt sub,.fmt sup{font-size:.7em;line-height:0}
.card .title{text-align:center}
.card.note:not(.show-prev){display:flex;flex-direction:column;justify-content:center}
#detail,#detail input,#detail .rich{text-align:left}
.rich blockquote{margin:0 0 0 1.2em}
.fmt{display:flex;flex-wrap:wrap;gap:6px}
.fmt .plain{padding:4px 10px;font-size:13px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--violet)}
.card .prev{display:none;padding:0 14px 12px;font-size:14px;line-height:1.5;color:var(--ink);overflow:hidden;word-break:break-word;pointer-events:none}
.card.show-prev .prev{display:block}
.card.show-prev .title{min-height:0;padding-bottom:6px}
.card.image.show-prev .prev{padding:0 12px 10px}
#d-links{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--grid);padding-top:16px}
#d-links:empty{display:none}
.linkrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.linkrow span{color:var(--muted);font-size:13px;min-width:92px}
.chip{background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--violet);font-weight:500}
.chip:hover{background:var(--violet-soft)}
@media (max-width:700px){
  #hint{display:none}
  #vp,#empty,#detail{left:0}
  #bar{left:16px}
  #toast{left:50%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside id="side">
  <div class="side-head"><b>Thought Map</b><button class="icon" id="s-close" type="button" aria-label="Hide sidebar">‹</button></div>
  <div class="side-search"><input id="q" type="search" placeholder="Search all maps" autocomplete="off" aria-label="Search all maps"></div>
  <div id="tree"></div>
  <div class="side-foot">
    <button class="plain" id="s-folder" type="button">+ Folder</button>
    <button class="plain" id="s-map" type="button">+ Map</button>
    <button class="plain" id="b-mode" type="button">Dark mode</button>
    <button class="plain" id="s-bak" type="button">Backup</button>
    <button class="plain" id="s-out" type="button">Sign out</button>
    <div class="side-note" id="s-who"></div>
  </div>
</aside>

<div id="vp">
  <div id="world">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg"><g id="edge-g"></g><path id="temp" d=""></path></svg>
    <div id="cards"></div>
    <div id="mini"></div>
    <div id="marq"></div>
  </div>
</div>

<div id="bar">
  <div class="group" id="m-group">
    <button id="b-side" type="button" aria-label="Show or hide folders">☰</button>
    <span id="crumb"></span>
    <button id="b-card" type="button">+ Card</button>
    <button id="b-img" type="button">+ Image</button>
  </div>
  <div class="group" id="z-group">
    <button id="b-out" type="button" aria-label="Zoom out">−</button>
    <span id="zoom">100%</span>
    <button id="b-in" type="button" aria-label="Zoom in">+</button>
    <button id="b-fit" type="button">Fit all</button>
  </div>
  <div id="r-group">
  <div id="status" data-s="loading">Loading</div>
  <div class="group arrows">
    <button id="b-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
    <button id="b-redo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
  </div>
  </div>
</div>
<input id="imp-file" type="file" accept=".json,application/json" hidden>
<input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" hidden>

<div id="empty"><div><b id="empty-h"></b><span id="empty-t"></span></div></div>
<div id="hint">Double-click empty space: new card · Drag a dot on a card: arrow · Double-click a card: detail page · Click a selected card's title: rename · Double-click then drag: select several · Ctrl+V: image · Ctrl+Z: undo</div>
<div id="toast"><span id="toast-t"></span><button id="toast-b" type="button" hidden>Undo</button></div>
<div id="menu"></div>
<div id="gate" class="on"><div class="box"><b>Thought Map</b><div id="gate-t">Loading…</div><button class="plain" id="gate-b" type="button" hidden>Sign in with Google</button></div></div>
<div id="ask"><div class="box"><div id="ask-t"></div><div class="btns"><button class="plain" id="ask-no" type="button">Cancel</button><button class="plain solid" id="ask-yes" type="button">Delete</button></div></div></div>

<div id="detail">
  <div class="sheet">
    <div class="sheet-top">
      <button class="plain" id="d-back" type="button">← Back to map</button>
      <button class="plain danger" id="d-del" type="button">Delete this card</button>
    </div>
    <input id="d-title" type="text" placeholder="Title" autocomplete="off">
    <div id="d-pic"></div>
    <label class="tog"><input type="checkbox" id="d-show"> Show these details on the map, in small text</label>
    <div class="fmt" id="d-fmt">
      <button class="plain" type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button class="plain" type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button class="plain" type="button" data-cmd="subscript" title="Subscript (Ctrl+,)">X<sub>2</sub></button>
      <button class="plain" type="button" data-cmd="superscript" title="Superscript (Ctrl+.)">X<sup>2</sup></button>
      <button class="plain" type="button" data-cmd="heading" title="Heading">Heading</button>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var vp=$('#vp'),world=$('#world'),edgeG=$('#edge-g'),temp=$('#temp'),layer=$('#cards'),mini=$('#mini');
var NS='http://www.w3.org/2000/svg';
var view={x:0,y:0,z:1},hadView=false;
var folders=new Map(),boards=new Map(),board=null,unsubs=[];
var cards=new Map(),edges=new Map(),els=new Map();
var sel=null,openId=null,db=null,assets=null;
var loaded={cards:false,edges:false};
var queue={},timers={},DEL={};
var LEG={red:'#d2453c',orange:'#d07a1f',green:'#2a9a66',blue:'#2f7fd6',gray:'#727785',violet:'#7447d1'};

function cleanLabel(t){return typeof t==='string'?t.replace(/\s+/g,' ').trim().slice(0,60):''}
function edgeCopy(e){return {from:String(e.from),to:String(e.to),color:hexOf(e.color),label:cleanLabel(e.label)}}
var OKTAG={SUB:1,SUP:1,B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,P:1,DIV:1,BR:1,H3:1,BLOCKQUOTE:1};
function sanitize(html){
  var doc=new DOMParser().parseFromString('<body>'+html+'</body>','text/html'),out=document.createElement('div');
  (function walk(src,dst){
    Array.prototype.forEach.call(src.childNodes,function(n){
      if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue));return}
      if(n.nodeType!==1)return;
      var tag=n.tagName;
      if(tag==='SCRIPT'||tag==='STYLE'||tag==='IFRAME'||tag==='OBJECT'||tag==='EMBED')return;
      if(OKTAG[tag]){var el=document.createElement(tag);dst.appendChild(el);walk(n,el)}else walk(n,dst);
    });

}
function textToHtml(t){
  var d=document.createElement('div');
  String(t).split('\n').forEach(function(line){var r=document.createElement('div');if(line)r.textContent=line;else r.appendChild(document.createElement('br'));d.appendChild(r)});
  return d.innerHTML;
}
var memoMap=new Map();
function memo(c){
  var k=(c.fmt||'')+'|'+(c.body||''),m=memoMap.get(k);
  if(m)return m;

  m={html:html,text:t.textContent.trim()};
  if(memoMap.size>400)memoMap.clear();

}
var SUBC={'0':'\u2080','1':'\u2081','2':'\u2082','3':'\u2083','4':'\u2084','5':'\u2085','6':'\u2086','7':'\u2087','8':'\u2088','9':'\u2089','+':'\u208a','-':'\u208b','=':'\u208c','(':'\u208d',')':'\u208e'};
var SUPC={'0':'\u2070','1':'\u00b9','2':'\u00b2','3':'\u00b3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079','+':'\u207a','-':'\u207b','=':'\u207c','(':'\u207d',')':'\u207e'};
function scripts(t){
  return String(t).replace(/_([0-9+\-=()]+)/g,function(m,g){return g.replace(/./g,function(ch){return SUBC[ch]})})
                  .replace(/\^([0-9+\-=()]+)/g,function(m,g){return g.replace(/./g,function(ch){return SUPC[ch]})});
}
function okId(a){return typeof a==='string'&&/^[A-Za-z0-9_-]{8,64}$/.test(a)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}

/* ---------- theme ---------- */
function setMode(m){
  if(m==='dark')document.documentElement.setAttribute('data-mode','dark');else document.documentElement.removeAttribute('data-mode');
  $('#b-mode').textContent=m==='dark'?'Light mode':'Dark mode';
}
setMode(ls('map-mode')==='dark'?'dark':'light');
$('#b-mode').addEventListener('click',function(){var m=document.documentElement.getAttribute('data-mode')==='dark'?'light':'dark';setMode(m);ls('map-mode',m)});

/* ---------- status / toast / confirm ---------- */
var statusEl=$('#status');
function setStatus(s,t){statusEl.dataset.s=s;statusEl.textContent=t}
function refreshStatus(){
  if(!db)return;
  if(statusEl.dataset.s==='error'||statusEl.dataset.s==='off')return;
  var busy=Object.keys(queue).length||Object.keys(timers).length;
  if(busy)setStatus('saving','Saving');else if(loaded.cards||!board)setStatus('saved','Saved');
}
var toastEl=$('#toast'),toastT=$('#toast-t'),toastB=$('#toast-b'),toastTimer=null,toastUndo=null;
function toast(text,undoFn,ms){
  clearTimeout(toastTimer);toastT.textContent=text;toastUndo=undoFn||null;toastB.hidden=!undoFn;
  toastEl.classList.add('on');
  if(ms!==0)toastTimer=setTimeout(hideToast,ms||(undoFn?7000:3500));
}
function hideToast(){toastEl.classList.remove('on');toastUndo=null}
toastB.addEventListener('click',function(){var u=toastUndo;hideToast();if(u)u()});
var askEl=$('#ask'),askDone=null;
function ask(text,label){
  $('#ask-t').textContent=text;$('#ask-yes').textContent=label||'Delete';askEl.classList.add('on');$('#ask-no').focus();
  return new Promise(function(res){askDone=function(v){askEl.classList.remove('on');askDone=null;res(v)}});
}
$('#ask-no').addEventListener('click',function(){if(askDone)askDone(false)});
$('#ask-yes').addEventListener('click',function(){if(askDone)askDone(true)});

/* ---------- storage ---------- */
function colPath(b,col){return b==='main'?col:'boards/'+b+'/'+col}
function clean(col,o){
  if(col==='edges'){var ed={from:String(o.from),to:String(o.to)};if(ecHex(o.color))ed.color=ecHex(o.color);var lb=cleanLabel(o.label);if(lb)ed.label=lb;return ed}
  var d={x:Math.round(o.x),y:Math.round(o.y),w:Math.round(o.w),title:o.title||'',body:o.body||'',kind:o.kind==='image'?'image':'note'};
  if(o.asset)d.asset=o.asset;
  if(o.ratio)d.ratio=o.ratio;
  if(o.color)d.color=o.color;
  if(o.h)d.h=Math.round(o.h);
  if(o.images&&o.images.length)d.images=o.images.slice();
  if(o.fmt==='html')d.fmt='html';
  if(o.show)d.show=true;
  return d;
}
function save(col,id,data){
  if(!db||!board)return;
  var path=colPath(board,col)+'/'+id,s=queue[path]||(queue[path]={busy:false,next:undefined});
  s.next=data===null?DEL:clean(col,data);
  refreshStatus();pump(path);
}
function pump(path){
  var s=queue[path];if(!s||s.busy)return;
  s.busy=true;
  (async function(){
    var ref=db.doc(path);
    while(s.next!==undefined){
      var d=s.next;s.next=undefined;
      for(var attempt=0;attempt<2;attempt++){
        try{if(d===DEL)await ref.delete();else await ref.set(d);break}
        catch(e){
          var code=e&&e.code;
          if(code==='unavailable'&&attempt===0){await new Promise(function(r){setTimeout(r,600+Math.random()*600)});continue}
          if(code==='invalid_argument')setStatus('error','Read-only: changes are not saved');
          else if(code==='quota_exceeded')setStatus('error','Storage is full');
          else setStatus('error','Save failed. Try reloading');
          break;
        }
      }
    }
    s.busy=false;delete queue[path];refreshStatus();
  })();
}
function saveSoon(id){
  clearTimeout(timers[id]);
  timers[id]=setTimeout(function(){delete timers[id];if(cards.has(id))save('cards',id,cards.get(id));refreshStatus()},600);
  refreshStatus();
}
function flush(id){
  if(timers[id]){clearTimeout(timers[id]);delete timers[id];if(cards.has(id))save('cards',id,cards.get(id))}
}
function okColor(c){return hexOf(c)}
function normCard(d){
  d=d||{};
  return {x:+d.x||0,y:+d.y||0,w:Math.min(900,Math.max(120,+d.w||200)),title:typeof d.title==='string'?d.title:'',
    body:typeof d.body==='string'?d.body:'',kind:d.kind==='image'?'image':'note',
    asset:typeof d.asset==='string'&&/^[A-Za-z0-9_-]{8,64}$/.test(d.asset)?d.asset:'',ratio:+d.ratio>0?+d.ratio:0,color:okColor(d.color),h:+d.h>0?Math.min(2000,Math.max(40,+d.h)):0,images:Array.isArray(d.images)?d.images.filter(okId).slice(0,30):[],fmt:d.fmt==='html'?'html':'',show:!!d.show};
}
function applySnap(col,snap){
  var map=col==='cards'?cards:edges,seen={},base=colPath(board,col)+'/';
  snap.docs.forEach(function(doc){
    seen[doc.id]=1;

    var d=doc.data()||{};
    map.set(doc.id,col==='cards'?normCard(d):edgeCopy(d));

    if(!seen[id]&&!queue[base+id]&&!(col==='cards'&&timers[id]))map.delete(id);
  });

  saneSel();
  if(openId&&!cards.has(openId))closeDetail();
  else if(openId)syncDetail(false);
  renderAll();buildMini();refreshStatus();
}

/* ---------- undo ---------- */
var undoStack=[],redoStack=[],trash=new Set();
function act(u,r){undoStack.push({u:u,r:r});if(undoStack.length>200)undoStack.shift();redoStack.length=0}
function afterHistory(){
  saneSel();
  if(openId&&!cards.has(openId))closeDetail();else if(openId)syncDetail(true);
  renderAll();buildMini();
}
function undo(){var a=undoStack.pop();if(!a){toast('Nothing to undo');return}a.u();redoStack.push(a);afterHistory()}
function redo(){var a=redoStack.pop();if(!a){toast('Nothing to redo');return}a.r();undoStack.push(a);afterHistory()}
function clearHistory(){
  undoStack.length=0;redoStack.length=0;
  if(assets){
    var used={};cards.forEach(function(c){if(c.asset)used[c.asset]=1;(c.images||[]).forEach(function(a){used[a]=1})});
    trash.forEach(function(a){if(!used[a])assets.delete(a).catch(function(){})});
  }

}
function putCard(id,c){
  if(c){cards.set(id,Object.assign({},c));save('cards',id,c)}
  else{var old=cards.get(id);if(old&&old.asset)trash.add(old.asset);if(old&&old.images)old.images.forEach(function(a){trash.add(a)});clearTimeout(timers[id]);delete timers[id];cards.delete(id);save('cards',id,null)}
}
function putEdge(id,e){if(e){edges.set(id,edgeCopy(e));save('edges',id,e)}else{edges.delete(id);save('edges',id,null)}}
function patchCard(id,p){var c=cards.get(id);if(!c)return;Object.assign(c,p);save('cards',id,c)}
function commit(id,before,after){
  var same=true;Object.keys(after).forEach(function(k){if(before[k]!==after[k])same=false});
  if(same)return;
  patchCard(id,after);
  act(function(){patchCard(id,before)},function(){patchCard(id,after)});
}

/* ---------- view ---------- */
function loadView(){
  view={x:0,y:0,z:1};hadView=false;
  try{var v=JSON.parse(ls('map-view-'+board)||'null');if(v&&isFinite(v.x)&&isFinite(v.y)&&v.z>=0.2&&v.z<=3){view={x:+v.x,y:+v.y,z:+v.z};hadView=true}}catch(e){}
  applyView(true);
}
function applyView(skipSave){
  world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.z+')';
  var g=24*view.z;while(g<12)g*=2;
  vp.style.backgroundSize=g+'px '+g+'px';
  vp.style.backgroundPosition=view.x+'px '+view.y+'px';
  $('#zoom').textContent=Math.round(view.z*100)+'%';
  placeMini();
  if(skipSave===true||!board)return;
  clearTimeout(applyView.t);var b=board,v=JSON.stringify(view);
  applyView.t=setTimeout(function(){ls('map-view-'+b,v)},400);
}
function toWorld(cx,cy){var r=vp.getBoundingClientRect();return {x:(cx-r.left-view.x)/view.z,y:(cy-r.top-view.y)/view.z}}
function zoomAt(cx,cy,f){
  var r=vp.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,nz=Math.min(3,Math.max(0.2,view.z*f)),k=nz/view.z;
  view.x=px-(px-view.x)*k;view.y=py-(py-view.y)*k;view.z=nz;applyView();
}
function centerZoom(f){var r=vp.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}
function fit(){
  if(!cards.size){view={x:0,y:0,z:1};applyView();return}
  var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  cards.forEach(function(c,id){var b=box(id);if(!b)return;x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.w);y2=Math.max(y2,b.y+b.h)});
  var r=vp.getBoundingClientRect(),padX=60,padTop=90,padBottom=60;
  var z=Math.min((r.width-padX*2)/Math.max(1,x2-x1),(r.height-padTop-padBottom)/Math.max(1,y2-y1),1.2);
  z=Math.max(0.2,z);
  view.z=z;view.x=(r.width-(x2-x1)*z)/2-x1*z;view.y=padTop+((r.height-padTop-padBottom)-(y2-y1)*z)/2-y1*z;applyView();
}

/* ---------- rendering ---------- */
function isSel(type,id){return !!sel&&((sel.type===type&&sel.id===id)||(type==='card'&&sel.type==='cards'&&sel.ids.indexOf(id)>=0))}
function saneSel(){
  if(!sel)return;
  if(sel.type==='cards'){
    sel.ids=sel.ids.filter(function(i){return cards.has(i)});
    if(!sel.ids.length)sel=null;else if(sel.ids.length===1)sel={type:'card',id:sel.ids[0]};
  }else if(!(sel.type==='card'?cards:edges).has(sel.id))sel=null;
}
function applyMap(m){Object.keys(m).forEach(function(i){patchCard(i,m[i])})}
var pal=null,editColors=false;
function palette(){
  if(pal)return pal.slice();
  var seen={},out=[];
  function add(h){if(h&&!seen[h]&&out.length<12){seen[h]=1;out.push(h)}}
  cards.forEach(function(c){add(c.color)});edges.forEach(function(e){add(e.color)});
  return out;
}
function savePal(list){
  pal=list.slice(0,12);
  if(db)db.doc('meta/palette').set({colors:pal}).catch(function(){toast('Could not save the color list. Try again.')});
}
function addColor(hex){var l=palette();if(l.indexOf(hex)>=0)return;if(l.length>=12)l.shift();l.push(hex);savePal(l)}
function removeColor(hex){savePal(palette().filter(function(h){return h!==hex}));if(!palette().length)editColors=false;buildMini()}
function adjustColor(old,nw){
  if(old===nw)return;
  var l=palette().map(function(h){return h===old?nw:h}).filter(function(h,i,a){return a.indexOf(h)===i});
  savePal(l);
  var cb={},ca={},es=[];
  cards.forEach(function(c,i){if(c.color===old){cb[i]={color:old};ca[i]={color:nw}}});
  edges.forEach(function(e,i){if(e.color===old)es.push(i)});
  function paint(m,hex){applyMap(m);es.forEach(function(i){var e=edges.get(i);if(e){var n=edgeCopy(e);n.color=hex;putEdge(i,n)}})}
  if(Object.keys(ca).length||es.length){paint(ca,nw);act(function(){paint(cb,old)},function(){paint(ca,nw)})}
  renderAll();buildMini();
}
function colorDots(cur,pick){
  var d=document.createElement('div');d.className='dots';
  function dot(hex,label){
    var b=document.createElement('button');b.type='button';b.className='dot'+(cur===hex?' cur':'')+(hex?'':' none');
    if(hex)b.style.background=hex;b.title=label;b.setAttribute('aria-label',label);
    b.addEventListener('click',function(){pick(hex)});d.appendChild(b);
  }
  function picker(cls,start,label,done){
    var l=document.createElement('label');l.className='dot '+cls;l.title=label;
    var inp=document.createElement('input');inp.type='color';inp.value=start;inp.setAttribute('aria-label',label);
    inp.addEventListener('change',function(){done(String(inp.value).toLowerCase())});
    l.appendChild(inp);d.appendChild(l);return l;
  }
  var list=palette();
  if(editColors){
    list.forEach(function(h){
      picker('edit',h,'Change this color',function(v){adjustColor(h,v)}).style.background=h;
      var x=document.createElement('button');x.type='button';x.className='x';x.textContent='×';x.title='Remove this color from the list';x.setAttribute('aria-label','Remove color '+h);
      x.addEventListener('click',function(){removeColor(h)});d.appendChild(x);
    });
  }else{
    dot('','No color');
    list.forEach(function(h){dot(h,'Color '+h)});
    picker('add',cur||'#7447d1','Pick a new color',function(v){addColor(v);pick(v)}).insertBefore(document.createTextNode('+'),null);
  }
  if(list.length){
    var t=document.createElement('button');t.type='button';t.className='ed';t.textContent=editColors?'Done':'Edit colors';
    t.addEventListener('click',function(){editColors=!editColors;buildMini()});d.appendChild(t);
  }
  return d;
}
function recolor(ids,hex){
  var b={},a={};
  ids.forEach(function(i){var k=cards.get(i);if(k){b[i]={color:k.color||''};a[i]={color:hex}}});
  applyMap(a);act(function(){applyMap(b)},function(){applyMap(a)});renderAll();buildMini();
}
function dupCards(ids){
  if(!board)return;
  var map={},newCards=[],newEdges=[];
  ids.forEach(function(i){
    var c=cards.get(i);if(!c)return;
    var n=Object.assign({},c,{x:c.x+28,y:c.y+28,images:(c.images||[]).slice()}),nid=newId('c');
    map[i]=nid;newCards.push([nid,n]);
  });
  if(!newCards.length)return;
  edges.forEach(function(e){if(map[e.from]&&map[e.to])newEdges.push([newId('e'),{from:map[e.from],to:map[e.to],color:e.color||'',label:e.label||''}])});
  function doIt(){newCards.forEach(function(c){putCard(c[0],c[1])});newEdges.forEach(function(e){putEdge(e[0],e[1])})}
  function undoIt(){newEdges.forEach(function(e){putEdge(e[0],null)});newCards.forEach(function(c){putCard(c[0],null)})}
  doIt();act(undoIt,doIt);renderAll();
  var nids=newCards.map(function(c){return c[0]});
  select(nids.length===1?{type:'card',id:nids[0]}:{type:'cards',ids:nids});
}
function deleteCards(ids){
  var items=[],gone={};
  ids.forEach(function(i){var c=cards.get(i);if(!c)return;flush(i);items.push([i,Object.assign({},c)])});
  edges.forEach(function(e,eid){if(ids.indexOf(e.from)>=0||ids.indexOf(e.to)>=0)gone[eid]=edgeCopy(e)});
  function doIt(){Object.keys(gone).forEach(function(k){putEdge(k,null)});items.forEach(function(i){putCard(i[0],null)})}
  function undoIt(){items.forEach(function(i){putCard(i[0],i[1])});Object.keys(gone).forEach(function(k){putEdge(k,gone[k])})}
  doIt();act(undoIt,doIt);sel=null;renderAll();buildMini();
  toast(items.length+' cards deleted',undo);
}
function renderCard(id){
  var c=cards.get(id),el=els.get(id);
  if(!el){
    el=document.createElement('div');el.dataset.id=id;
    var pic=document.createElement('div');pic.className='pic';
    var t=document.createElement('div');t.className='title';
    var more=document.createElement('span');more.className='more';more.title='Has details';
    el.appendChild(pic);el.appendChild(t);el.appendChild(more);
    ['n','e','s','w'].forEach(function(d){var h=document.createElement('i');h.className='h h-'+d;el.appendChild(h)});
    var g=document.createElement('i');g.className='grip';el.appendChild(g);
    layer.appendChild(el);els.set(id,el);
  }
  el.className='card '+c.kind+(isSel('card',id)?' sel':'')+(memo(c).text||(c.images&&c.images.length)?' has-body':'')+(c.show&&memo(c).text?' show-prev':'');
  var pv=el.querySelector('.prev');
  if(!pv){pv=document.createElement('div');pv.className='prev rich';el.insertBefore(pv,el.querySelector('.more'))}
  var pk=c.show?memo(c).html:'';
  if(pv._k!==pk){pv._k=pk;pv.innerHTML=pk}
  pv.style.maxHeight=(c.h?Math.max(40,c.h-56):200)+'px';
  if(c.color){el.dataset.c='1';el.style.setProperty('--cc',c.color)}else{delete el.dataset.c;el.style.removeProperty('--cc')}
  el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.width=c.w+'px';
  el.style.minHeight=c.h&&c.kind!=='image'?c.h+'px':'';
  var title=el.querySelector('.title');
  if(title.contentEditable!=='true')title.textContent=c.title;
  title.dataset.ph=c.kind==='image'?'':'Untitled';
  var p=el.querySelector('.pic');
  if(c.kind==='image'&&c.asset){
    var img=p.querySelector('img');

  unsubs.forEach(function(u){u()});unsubs=[];
  board=id;sel=null;cards.clear();edges.clear();els.forEach(function(el){el.remove()});els.clear();
  loaded={cards:false,edges:false};
  if(id)ls('map-board',id);
  loadView();renderAll();buildMini();renderTree();updateCrumb();refreshStatus();
  if(!id||!db)return;
  var b=id,first=true;
  var slow=setTimeout(function(){if(b===board&&!loaded.cards)setStatus('error','Still loading. Check your connection')},10000);
  function fail(){if(b!==board)return;clearTimeout(slow);setStatus('error','Could not load. Try reloading')}
  unsubs.push(db.collection(colPath(b,'cards')).onSnapshot(function(snap){
    if(b!==board)return;
    if(!snap.metadata||!snap.metadata.fromCache){clearTimeout(slow);if(statusEl.dataset.s==='error'&&!Object.keys(queue).length)statusEl.dataset.s='saved'}
    applySnap('cards',snap);
    if(first&&cards.size){first=false;if(!hadView)fit()}
    if(pendingFocus&&cards.has(pendingFocus)){var pf=pendingFocus;pendingFocus=null;centerOn(pf)}
  },fail));
  unsubs.push(db.collection(colPath(b,'edges')).onSnapshot(function(snap){if(b===board)applySnap('edges',snap)},fail));
  unsubs.push(function(){clearTimeout(slow)});
}

var qEl=$('#q'),idxCache={},pendingFocus=null,qToken=0,qTimer=null;
function centerOn(id){
  var c=cards.get(id),b=box(id);if(!c||!b)return;
  var r=vp.getBoundingClientRect();
  view.x=r.width/2-(b.x+b.w/2)*view.z;view.y=r.height/2-(b.y+b.h/2)*view.z;applyView();
  select({type:'card',id:id});

async function boardItems(b){
  if(b===board){var live=[];cards.forEach(function(c,id){live.push({b:b,id:id,t:c.title,x:memo(c).text,k:c.kind})});return live}
  var hit=idxCache[b];
  if(hit&&Date.now()-hit.at<120000)return hit.items;
  if(!db)return [];
  var snap=await db.collection(colPath(b,'cards')).get(),items=[];
  snap.docs.forEach(function(d){var c=normCard(d.data());items.push({b:b,id:d.id,t:c.title,x:memo(c).text,k:c.kind})});
  idxCache[b]={at:Date.now(),items:items};return items;
}
function note(text){tree.textContent='';var n=document.createElement('div');n.className='side-note';n.textContent=text;tree.appendChild(n)}
async function runSearch(){
  var q=qEl.value.trim().toLowerCase(),token=++qToken;
  if(!q){searching=false;renderTree();return}
  searching=true;note('Searching…');
  var all=[];
  try{
    var ids=Array.from(boards.keys());
    for(var i=0;i<ids.length;i++){all=all.concat(await boardItems(ids[i]));if(token!==qToken)return}
  }catch(e){note('Could not search. Check your connection.');return}
  var hits=all.filter(function(it){return (it.t||'').toLowerCase().indexOf(q)>=0||(it.x||'').toLowerCase().indexOf(q)>=0});
  if(!hits.length){note('No cards match.');return}
  tree.textContent='';
  hits.slice(0,80).forEach(function(it){
    var bt=document.createElement('button');bt.type='button';bt.className='hit';
    var t=document.createElement('b');t.textContent=it.t||(it.k==='image'?'Image':'Untitled');
    var s2=document.createElement('span'),bd=boards.get(it.b),where=bd?bd.name:'',i2=(it.x||'').toLowerCase().indexOf(q);
    s2.textContent=where+(i2>=0?' · '+(i2>20?'…':'')+it.x.slice(Math.max(0,i2-20),i2+70).replace(/\s+/g,' '):'');
    bt.appendChild(t);bt.appendChild(s2);
    bt.addEventListener('click',function(){
      if(it.b===board){if(openId)closeDetail();centerOn(it.id)}else{pendingFocus=it.id;setBoard(it.b)}
      if(window.innerWidth<=700)toggleSide(false);
    });
    tree.appendChild(bt);
  });
  if(hits.length>80)tree.appendChild(Object.assign(document.createElement('div'),{className:'side-note',textContent:'Showing the first 80 of '+hits.length+' matches.'}));
}
qEl.addEventListener('input',function(){clearTimeout(qTimer);qTimer=setTimeout(runSearch,250)});
qEl.addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();qEl.value='';runSearch();qEl.blur()}});

/* ---------- backup ---------- */
var OKID=/^[A-Za-z0-9_-]{1,64}$/;
async function exportAll(){
  if(!db){toast('Not connected, so there is nothing to back up');return}
  Object.keys(timers).forEach(flush);
  toast('Preparing backup…',null,0);
  try{
    var out={app:'thought-map',version:1,exported:new Date().toISOString(),folders:{},boards:{},palette:pal||[],images:{}},imgs={},nCards=0;
    folders.forEach(function(f,id){out.folders[id]={name:f.name,order:f.order}});
    var ids=Array.from(boards.keys());
    for(var i=0;i<ids.length;i++){
      var id=ids[i],b=boards.get(id),co={},eo={};
      var cs=await db.collection(colPath(id,'cards')).get(),es=await db.collection(colPath(id,'edges')).get();
      cs.docs.forEach(function(d){var c=clean('cards',normCard(d.data()));co[d.id]=c;nCards++;if(c.asset)imgs[c.asset]=1;(c.images||[]).forEach(function(a){imgs[a]=1})});
      es.docs.forEach(function(d){eo[d.id]=clean('edges',d.data()||{})});
      out.boards[id]={name:b.name,folder:b.folder||'',order:b.order,cards:co,edges:eo};
    }
    var keys=Object.keys(imgs);
    for(var j=0;j<keys.length;j++){
      var sn=await db.doc('images/'+keys[j]).get(),dv=sn.exists&&sn.data()?sn.data().d:null;
      if(typeof dv==='string')out.images[keys[j]]=dv;
    }
    var url=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'})),a=document.createElement('a');
    a.href=url;a.download='thought-map-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},15000);
    toast('Backup file made: '+ids.length+' maps, '+nCards+' cards, '+Object.keys(out.images).length+' images');
  }catch(e){toast('Could not make the backup. Try again.')}
}
async function inChunks(jobs,size){
  for(var i=0;i<jobs.length;i+=size)await Promise.all(jobs.slice(i,i+size).map(function(j){return j()}));
}
async function importFile(file){
  if(!db){toast('Not connected');return}
  var data;
  try{data=JSON.parse(await file.text())}catch(e){toast('That file is not a Thought Map backup');return}
  if(!data||data.app!=='thought-map'||typeof data.boards!=='object'){toast('That file is not a Thought Map backup');return}
  var bids=Object.keys(data.boards||{}).filter(function(k){return OKID.test(k)});
  var ok=await ask('Restore '+bids.length+' maps from this backup? Maps and cards with the same ID are overwritten with the backup copy. Nothing else is deleted.','Restore');
  if(!ok)return;
  toast('Restoring…',null,0);
  try{
    var jobs=[];
    Object.keys(data.folders||{}).forEach(function(k){
      if(!OKID.test(k))return;var f=data.folders[k]||{};
      jobs.push(function(){return db.doc('folders/'+k).set({name:normName(f.name,'Folder'),order:+f.order||0})});
    });
    bids.forEach(function(k){
      var b=data.boards[k]||{};
      jobs.push(function(){return db.doc('boards/'+k).set({name:normName(b.name,'Map'),folder:typeof b.folder==='string'&&OKID.test(b.folder)?b.folder:'',order:+b.order||0})});
      Object.keys(b.cards||{}).forEach(function(c){if(OKID.test(c))jobs.push(function(){return db.doc(colPath(k,'cards')+'/'+c).set(clean('cards',normCard(b.cards[c])))})});
      Object.keys(b.edges||{}).forEach(function(e){
        var ed=b.edges[e]||{};
        if(OKID.test(e)&&OKID.test(String(ed.from))&&OKID.test(String(ed.to)))jobs.push(function(){return db.doc(colPath(k,'edges')+'/'+e).set(clean('edges',ed))});
      });
    });
    Object.keys(data.images||{}).forEach(function(k){
      var dv=data.images[k];
      if(okId(k)&&typeof dv==='string'&&dv.length<1000000&&/^data:image\/(png|jpeg|gif|webp|svg\+xml)[;,]/.test(dv))jobs.push(function(){return db.doc('images/'+k).set({d:dv})});
    });
    if(Array.isArray(data.palette)){var pl=data.palette.map(hexOf).filter(Boolean).slice(0,12);if(pl.length)jobs.push(function(){return db.doc('meta/palette').set({colors:pl})})}
    await inChunks(jobs,15);
    idxCache={};
    toast('Restore finished: '+jobs.length+' items written');
  }catch(e){toast('The restore stopped partway. Run it again to finish.')}
}
async function duplicateMap(id){
  var b=boards.get(id);if(!b)return;
  if(!db){toast('Not connected');return}
  if(id===board)Object.keys(timers).forEach(flush);
  toast('Duplicating map…',null,0);
  try{
    var nid=newId('b'),src=colPath(id,'cards'),cs=await db.collection(src).get(),es=await db.collection(colPath(id,'edges')).get(),imgMap={},jobs=[];
    var copyImg=async function(a){
      if(a in imgMap)return imgMap[a];
      var sn=await db.doc('images/'+a).get(),dv=sn.exists&&sn.data()?sn.data().d:null;
      if(typeof dv!=='string'){imgMap[a]='';return ''}
      var n=newId('i');await db.doc('images/'+n).set({d:dv});imgMap[a]=n;return n;
    };
    for(var i=0;i<cs.docs.length;i++){
      var d=cs.docs[i],c=clean('cards',normCard(d.data()));
      if(c.asset){c.asset=await copyImg(c.asset);if(!c.asset)delete c.asset}
      if(c.images){
        var arr=[];
        for(var j=0;j<c.images.length;j++){var n2=await copyImg(c.images[j]);if(n2)arr.push(n2)}
        if(arr.length)c.images=arr;else delete c.images;
      }
      (function(cid,body){jobs.push(function(){return db.doc(colPath(nid,'cards')+'/'+cid).set(body)})})(d.id,c);
    }
    es.docs.forEach(function(e){var body=clean('edges',e.data()||{});jobs.push(function(){return db.doc(colPath(nid,'edges')+'/'+e.id).set(body)})});
    await inChunks(jobs,15);
    var nb={name:(b.name+' copy').slice(0,80),folder:b.folder||'',order:Date.now()};
    boards.set(nid,nb);writeMeta('map',nid,nb);
    toast('Map duplicated: '+cs.docs.length+' cards copied');
    setBoard(nid);
  }catch(e){toast('Could not finish duplicating the map. Try again.')}
}
